<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="ytMarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="markGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background tile -->
  <rect x="2" y="2" width="60" height="60" rx="18" fill="#0d0f17" />
  <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#ytMarkGrad)" opacity="0.18" />
  <rect x="2.5" y="2.5" width="59" height="59" rx="17.5" stroke="url(#ytMarkGrad)" stroke-width="1.5" opacity="0.6" />

  <!-- Y-T Flow Icon -->
  <path d="M18 19 L32 34 L46 19 M32 34 L32 47" stroke="url(#ytMarkGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#markGlow)" />
  <path d="M20 47 L44 47" stroke="url(#ytMarkGrad)" stroke-width="4" stroke-linecap="round" />

  <circle cx="18" cy="19" r="3" fill="#34d399" />
  <circle cx="46" cy="19" r="3" fill="#8b5cf6" />
  <circle cx="32" cy="34" r="3" fill="#06b6d4" />
</svg>
