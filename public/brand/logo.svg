<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="360" height="80" fill="none">
  <defs>
    <linearGradient id="ytGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="ytGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.2" />
    </linearGradient>
    <filter id="ytFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Icon: Hexagonal TechFlow Emblem with Intersecting Node Lines -->
  <g transform="translate(14, 10)">
    <rect x="0" y="0" width="60" height="60" rx="18" fill="url(#ytGrad)" opacity="0.15" />
    <rect x="0.5" y="0.5" width="59" height="59" rx="17.5" stroke="url(#ytGrad)" stroke-width="1.5" opacity="0.5" />
    <!-- Dynamic Y-T Geometric Flow -->
    <path d="M16 18 L30 33 L44 18 M30 33 L30 46" stroke="url(#ytGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#ytFilter)" />
    <path d="M18 46 L42 46" stroke="url(#ytGrad)" stroke-width="4" stroke-linecap="round" />
    <!-- Quantum Nodes -->
    <circle cx="16" cy="18" r="3" fill="#34d399" />
    <circle cx="44" cy="18" r="3" fill="#8b5cf6" />
    <circle cx="30" cy="33" r="3" fill="#06b6d4" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(88, 48)">
    <text font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" letter-spacing="1.5" fill="#ffffff">
      YAPPING
    </text>
    <text x="114" y="0" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" letter-spacing="2" fill="url(#ytGrad)">
      TECHFLOW
    </text>
  </g>
  <g transform="translate(89, 63)">
    <text font-family="ui-monospace, monospace" font-size="9" font-weight="700" letter-spacing="2.5" fill="#a1a1aa">
      AI PENTHOUSE &amp; MISSION CONTROL
    </text>
  </g>
</svg>
